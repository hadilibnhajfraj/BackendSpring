# Identifiants du projet SonarCloud
sonar.projectKey=pidevspringprojects_backendspring
sonar.organization=pidevspringprojects
sonar.host.url=https://sonarcloud.io

# Code source
sonar.sources=src
sonar.java.binaries=target

# Exclusions
sonar.exclusions=**/test/**, **/target/**, **/*.md, **/*.yml, **/*.yaml

# Silence les logs détaillés
sonar.verbose=false
