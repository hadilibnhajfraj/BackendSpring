name: CI/CD with SonarCloud and Nexus

on:
  push:
    branches: [ main, hadil, amina, raouf ]
  pull_request:
    branches: [ main, hadil, amina, raouf ]

jobs:
  build:
    name: Build, Analyze, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml

      - name: Build project
        run: mvn clean install -DskipTests

      - name: Build project with tests
        run: mvn clean install -Ptest

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=PIDEVSpring_BackendSpring \
            -Dsonar.organization=pidevspringprojects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Deploy .jar to Nexus
        run: |
          mvn deploy -DaltDeploymentRepository=nexus::default::https://${{ secrets.NGROK_NEXUS_URL }}/repository/maven-releases/
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t mon-app:latest .

      - name: Tag Docker Image
        run: docker tag mon-app:latest ${{ secrets.NGROK_NEXUS_URL }}/repository/mon-repo/mon-app:latest

      - name: Docker Login to Nexus
        run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NGROK_NEXUS_URL }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin

      - name: Push Docker Image to Nexus
        run: docker push ${{ secrets.NGROK_NEXUS_URL }}/repository/mon-repo/mon-app:latest
