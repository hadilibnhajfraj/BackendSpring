name: CI/CD with SonarCloud and Nexus

on:
  push:
    branches: [main, hadil, amina, raouf, MeriemBenSalem_bk]
  pull_request:
    branches: [main, hadil, amina, raouf, MeriemBenSalem_bk]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_URL: 6c57-2c0f-4280-60-4b-c18a-af49-767c-a23c.ngrok-free.app
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml

      - name: Build project (skip tests)
        run: mvn clean install -DskipTests

      - name: SonarCloud Analysis
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=PIDEVSpring_BackendSpring \
            -Dsonar.organization=pidevspringprojects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      - name: Deploy .jar to Nexus (skip tests)
        run: mvn deploy -DskipTests
