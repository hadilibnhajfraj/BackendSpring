name: CI/CD with SonarCloud and Nexus

on:
  push:
    branches: [main, hadil, amina, raouf]
  pull_request:
    branches: [main, hadil, amina, raouf]

jobs:
  build:
    name: Build, Analyze, and Deploy
    runs-on: ubuntu-latest

    env:
      NGROK_NEXUS_URL: 6e31-41-226-25-4.ngrok-free.app
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>$NEXUS_USERNAME</username>
                <password>$NEXUS_PASSWORD</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml
        env:
          NEXUS_USERNAME: ${{ env.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ env.NEXUS_PASSWORD }}

      - name: Build project
        run: mvn clean install -DskipTests

      - name: Run SonarCloud analysis
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=PIDEVSpring_BackendSpring \
            -Dsonar.organization=pidevspringprojects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Deploy .jar to Nexus
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            mvn deploy -DaltDeploymentRepository=nexus::default::https://${NGROK_NEXUS_URL}/repository/maven-releases/
          else
            mvn deploy -DaltDeploymentRepository=nexus::default::https://${NGROK_NEXUS_URL}/repository/maven-snapshots/
          fi
        env:
          NGROK_NEXUS_URL: ${{ env.NGROK_NEXUS_URL }}

      - name: Build Docker Image
        run: docker build -t mon-app:latest .

      - name: Tag Docker Image
        run: docker tag mon-app:latest $NGROK_NEXUS_URL/repository/mon-repo/mon-app:latest
        env:
          NGROK_NEXUS_URL: ${{ env.NGROK_NEXUS_URL }}

      - name: Docker Login to Nexus
        run: echo "$NEXUS_PASSWORD" | docker login $NGROK_NEXUS_URL -u $NEXUS_USERNAME --password-stdin
        env:
          NGROK_NEXUS_URL: ${{ env.NGROK_NEXUS_URL }}
          NEXUS_USERNAME: ${{ env.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ env.NEXUS_PASSWORD }}

      - name: Push Docker Image to Nexus
        run: docker push $NGROK_NEXUS_URL/repository/mon-repo/mon-app:latest
        env:
          NGROK_NEXUS_URL: ${{ env.NGROK_NEXUS_URL }}
