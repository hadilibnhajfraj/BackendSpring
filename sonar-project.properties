# Identifiants SonarCloud (obtenus lors de la cr?ation du projet)
sonar.projectKey=hadilibnhajfraj_BackendSpring
sonar.organization=hadilibnhajfraj
sonar.host.url=https://sonarcloud.io

# Code source Java
sonar.sources=src
sonar.language=java
