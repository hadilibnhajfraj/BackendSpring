name: CI/CD with SonarCloud and Nexus

on:
  push:
    branches: [ main, hadil, amina, raouf ]
  pull_request:
    branches: [ main, hadil, amina, raouf ]

jobs:
  build:
    name: Build, Analyze, and Deploy
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 2 : Installer JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Étape 3 : Cache SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Étape 4 : Build sans tests (création du .jar)
      - name: Build project
        run: mvn clean install -DskipTests

      # Étape 5 : Analyse SonarCloud
      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=PIDEVSpring_BackendSpring \
            -Dsonar.organization=pidevspringprojects \
            -Dsonar.host.url=https://sonarcloud.io

      # Étape 6 : Déploiement du .jar vers Nexus via Ngrok
      - name: Deploy .jar to Nexus
        run: |
          mvn deploy -DaltDeploymentRepository=nexus::default::https://${{ secrets.NGROK_NEXUS_URL }}/repository/maven-releases/
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # Étape 7 : Build de l'image Docker
      - name: Build Docker Image
        run: docker build -t mon-app:latest .

      # Étape 8 : Tag de l'image pour Nexus via Ngrok
      - name: Tag Docker Image
        run: docker tag mon-app:latest ${{ secrets.NGROK_NEXUS_URL }}/repository/mon-repo/mon-app:latest

      # Étape 9 : Connexion au registre Nexus Docker
      - name: Docker Login to Nexus
        run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NGROK_NEXUS_URL }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin

      # Étape 10 : Push de l'image Docker vers Nexus
      - name: Push Docker Image to Nexus
        run: docker push ${{ secrets.NGROK_NEXUS_URL }}/repository/mon-repo/mon-app:latest
