name: SonarCloud Analysis

on:
  push:
    branches:
      - hadil
      - ala
      - rafik
      - amina
      - MeriemBenSalem_bk
      - raouf
  pull_request:
    branches:
      - main

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and Analyze without Tests
        run: mvn clean install -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=hadilibnhajfraj_BackendSpring \
          -Dsonar.organization=hadilibnhajfraj \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
