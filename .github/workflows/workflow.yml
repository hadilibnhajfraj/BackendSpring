name: CI/CD with SonarCloud and Nexus

on:
  push:
    branches: [main, hadil, amina, raouf]
  pull_request:
    branches: [main, hadil, amina, raouf]

jobs:
  build:
    name: Build, Analyze, and Deploy
    runs-on: ubuntu-latest

    env:
      NGROK_NEXUS_HOST: 6e31-41-226-25-4.ngrok-free.app
      MAVEN_PORT: 8081
      DOCKER_PORT: 8083
      NEXUS_USERNAME: admin
      NEXUS_PASSWORD: admin
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml

      - name: Build project (skip tests)
        run: mvn clean install -DskipTests

      - name: SonarCloud Analysis
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=PIDEVSpring_BackendSpring \
            -Dsonar.organization=pidevspringprojects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      - name: Deploy .jar to Nexus (Maven)
        run: |
          mvn deploy -DaltDeploymentRepository=nexus::default::https://${NGROK_NEXUS_HOST}:${MAVEN_PORT}/repository/maven-releases/

      - name: Build Docker Image
        run: docker build -t mon-app:latest .

      - name: Tag Docker Image
        run: docker tag mon-app:latest ${NGROK_NEXUS_HOST}:${DOCKER_PORT}/docker-repo/mon-app:latest

      - name: Docker Login to Nexus
        run: echo "$NEXUS_PASSWORD" | docker login ${NGROK_NEXUS_HOST}:${DOCKER_PORT} -u $NEXUS_USERNAME --password-stdin

      - name: Push Docker Image to Nexus
        run: docker push ${NGROK_NEXUS_HOST}:${DOCKER_PORT}/docker-repo/mon-app:latest
