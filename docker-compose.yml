version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pidevbi
      MYSQL_USER: springuser
      MYSQL_PASSWORD: springpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backendpi:
    build: .
    ports:
      - "8082:8082"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pidevbi?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: springpassword
    command: [ "./wait-for-it.sh", "mysql:3306", "--", "java", "-jar", "app.jar" ]

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8083:8081"      # Port local 8083 -> port conteneur 8081
    volumes:
      - nexus-data:/nexus-data
    restart: always

volumes:
  mysql_data:
  nexus-data:
